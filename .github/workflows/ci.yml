name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly audit
  workflow_dispatch:
    inputs:
      first_dashboard:
        description: "First deploy of the autofill dashboard: start its history empty (D77 §4)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By event too, so a push to main doesn't cancel the nightly run (and the
  # dashboard deploy at its end, D77).
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt-lint:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check

  core-test:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Only node is needed here; skip the automatic pnpm cache.
          package-manager-cache: false
      - run: cargo test --workspace --all-features --locked
      - run: just test-vectors
      - name: The Emergency Kit's golden PDFs are valid (D42)
        run: |
          sudo apt-get install -y -qq qpdf
          for pdf in core/pwm-kit/tests/golden/*.pdf; do qpdf --check "$pdf"; done

  # Server integration tests against a real Postgres (D25). PWM_REQUIRE_DB
  # turns a missing database into a failure instead of a skip.
  server-test:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pwm
          POSTGRES_PASSWORD: pwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PWM_TEST_DATABASE_URL: postgres://pwm:pwm@localhost:5432/postgres
      PWM_REQUIRE_DB: "1"
      # A second Postgres with TLS on (service containers cannot pass flags).
      PWM_TEST_TLS_DATABASE_URL: postgres://pwm:pwm@localhost:54330/postgres
      PWM_REQUIRE_TLS_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - run: >-
          docker run -d --name pwm-test-tls -p 54330:5432 -e POSTGRES_USER=pwm -e POSTGRES_PASSWORD=pwm
          postgres:17 -c ssl=on -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
          -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: until docker exec pwm-test-tls psql -U pwm -h 127.0.0.1 -tAc "select 1"; do sleep 1; done
      - run: cargo test -p pwm-server --locked

  # The core in the browser (D31, D34): WASM build, the Node smoke test, the
  # extension's tests over the real core, and the extension build and its checks.
  wasm:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --locked --release -p pwm-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir extension/core target/wasm32-unknown-unknown/release/pwm_wasm.wasm
      - run: wasm-bindgen --target nodejs --out-dir target/wasm/node target/wasm32-unknown-unknown/release/pwm_wasm.wasm
      - run: node core/pwm-wasm/smoke/smoke.mjs target/wasm/node/pwm_wasm.js
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/extension test:wasm
      # Both targets (D40): dist/chromium/, dist/firefox/ and a zip of each.
      - run: pnpm --filter @pwm/extension build
      # Mozilla's linter (MPL-2.0), run here only: it is not a dependency.
      - run: npx --yes web-ext@8.3.0 lint --source-dir extension/dist/firefox
      # The runner image has Firefox and geckodriver.
      - run: pnpm --filter @pwm/autofill-harness firefox-smoke "$(ls "$GITHUB_WORKSPACE"/extension/dist/pwm-firefox-*.zip)"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            extension/dist/*.zip
          retention-days: 14

  # The core for the apps (D31): UniFFI bindings, compiled and run on Linux,
  # then the Swift package (D41) tested against them and a sync server.
  bindings:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pwm
          POSTGRES_PASSWORD: pwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p pwm-ffi
      - run: |
          for lang in swift kotlin; do
            cargo run --locked -q -p pwm-ffi-bindgen -- generate --library target/debug/libpwm_ffi.so \
              --language "$lang" --out-dir "target/bindings/$lang" --no-format
          done
      - name: Swift
        run: |
          swiftc -module-name pwm_ffi -I target/bindings/swift \
            -Xcc -fmodule-map-file=target/bindings/swift/pwm_ffiFFI.modulemap \
            target/bindings/swift/pwm_ffi.swift core/pwm-ffi/smoke/swift/main.swift \
            -L target/debug -lpwm_ffi -o target/swift-smoke
          LD_LIBRARY_PATH=target/debug target/swift-smoke
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Kotlin
        run: |
          curl -fsSL -o target/jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.17.0/jna-5.17.0.jar
          kotlinc target/bindings/kotlin/uniffi/pwm_ffi/pwm_ffi.kt core/pwm-ffi/smoke/kotlin/Smoke.kt \
            -cp target/jna.jar -include-runtime -d target/kotlin-smoke.jar
          java -Djna.library.path=target/debug -cp target/kotlin-smoke.jar:target/jna.jar SmokeKt
      - run: bash apps/apple/PWMKit/generate.sh linux
      - run: node scripts/tokens-swift.mjs --check
      - run: cargo build --locked -p pwm-server
      - name: Start the sync server
        env:
          PWM_DATABASE_URL: postgres://pwm:pwm@localhost:5432/postgres
        run: |
          export PWM_SERVER_SECRETS="$(target/debug/pwm-server keygen)"
          nohup target/debug/pwm-server > target/pwm-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if target/debug/pwm-server healthcheck; then exit 0; fi
            sleep 1
          done
          cat target/pwm-server.log
          exit 1
      - name: Swift package tests (Linux)
        working-directory: apps/apple/PWMKit
        env:
          PWM_TEST_SERVER: http://127.0.0.1:8080
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: swift test -Xlinker -L${{ github.workspace }}/target/debug
      - if: failure()
        run: cat target/pwm-server.log || true

  # Whether the Apple job needs to run: only for changes to the Swift package
  # or the core, so other PRs spend no macOS minutes (D41 §6).
  apple-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/apple/|core/|Cargo\.(toml|lock)$|design/tokens\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The Swift package on Apple platforms (D41): the core as an XCFramework,
  # the tests on macOS and a build for the iOS simulator.
  apple:
    needs: apple-changes
    if: needs.apple-changes.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: bash apps/apple/PWMKit/generate.sh apple
      # A local sync server for the package's server tests and the app's UI
      # test (D42 §6), as in the Linux job but with Postgres from Homebrew.
      - run: brew install postgresql@17 xcodegen
      - name: Start Postgres
        run: |
          pg="$(brew --prefix postgresql@17)/bin"
          "$pg/initdb" -D "$RUNNER_TEMP/pg" -U pwm --auth=trust > /dev/null
          "$pg/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432" -w start
      - run: cargo build --locked -p pwm-server
      - name: Start the sync server
        env:
          PWM_DATABASE_URL: postgres://pwm@localhost:5432/postgres
        run: |
          export PWM_SERVER_SECRETS="$(target/debug/pwm-server keygen)"
          echo "$PWM_SERVER_SECRETS" > "$RUNNER_TEMP/server-secrets"
          nohup target/debug/pwm-server > target/pwm-server.log 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for _ in $(seq 1 60); do
            if target/debug/pwm-server healthcheck; then exit 0; fi
            sleep 1
          done
          cat target/pwm-server.log
          exit 1
      - name: Swift package tests (macOS)
        working-directory: apps/apple/PWMKit
        env:
          PWM_TEST_SERVER: http://127.0.0.1:8080
        run: swift test
      # The package's server tests use up the per-IP sign-up limit (10
      # requests an hour); the limiter is in memory, so a restart with the
      # same secrets gives the UI test its own.
      - name: Restart the sync server
        env:
          PWM_DATABASE_URL: postgres://pwm@localhost:5432/postgres
        run: |
          kill "$(cat "$RUNNER_TEMP/server.pid")"
          for _ in $(seq 1 30); do
            target/debug/pwm-server healthcheck > /dev/null 2>&1 || break
            sleep 1
          done
          export PWM_SERVER_SECRETS="$(cat "$RUNNER_TEMP/server-secrets")"
          nohup target/debug/pwm-server >> target/pwm-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if target/debug/pwm-server healthcheck; then exit 0; fi
            sleep 1
          done
          cat target/pwm-server.log
          exit 1
      - name: The iOS app's UI test in the simulator
        working-directory: apps/apple
        # A hang fails this step (and the test, with where it stopped)
        # instead of cancelling the job, so the steps below still report.
        timeout-minutes: 25
        env:
          TEST_RUNNER_PWM_TEST_SERVER: http://127.0.0.1:8080
        run: |
          xcodegen generate
          device="$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcodebuild test -project PWM.xcodeproj -scheme PWM -destination "id=$device" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" -quiet             -test-timeouts-enabled YES -default-test-execution-time-allowance 900 -maximum-test-execution-time-allowance 900
      # The macOS app (D48 §6): its credential provider is built with it.
      # CI signs ad-hoc, so the app is built with no entitlements (see
      # Mac/PWMMac-CI.entitlements); it then keeps its own login-keychain
      # items and cache, as a build without the shared groups does.
      - name: The macOS app's UI test
        working-directory: apps/apple
        timeout-minutes: 20
        env:
          TEST_RUNNER_PWM_TEST_SERVER: http://127.0.0.1:8080
        run: |
          # The app then uses the login keychain: make it one that is
          # unlocked, so nothing waits for a password prompt.
          security create-keychain -p ci "$RUNNER_TEMP/pwm-ci.keychain-db"
          security set-keychain-settings "$RUNNER_TEMP/pwm-ci.keychain-db"
          security unlock-keychain -p ci "$RUNNER_TEMP/pwm-ci.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/pwm-ci.keychain-db" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$RUNNER_TEMP/pwm-ci.keychain-db"
          xcodebuild test -project PWM.xcodeproj -scheme PWMMac -destination "platform=macOS" -resultBundlePath "$RUNNER_TEMP/mac.xcresult" -quiet             CODE_SIGN_ENTITLEMENTS=Mac/PWMMac-CI.entitlements             -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600
      - if: failure()
        run: cat target/pwm-server.log || true
      - name: Keychain refusals (statuses only, never values)
        if: failure()
        run: log show --last 30m --style compact --predicate 'subsystem == "pwm"' | tail -40 || true
      - name: UI test failures
        if: failure()
        run: |
          for result in ui mac; do
            [ -d "$RUNNER_TEMP/$result.xcresult" ] || continue
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/$result.xcresult" --compact               | jq -r '.. | objects | select(.nodeType? == "Failure Message") | .name'
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/mac.xcresult
          if-no-files-found: ignore

  # The server image and compose stack (D30): build, start, smoke test.
  # Whether the Android job needs to run: only for changes to the Android
  # app, the core or the shared design files (D52 §8).
  android-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/android/|core/|Cargo\.(toml|lock)$|design/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The Android app (D52 §8): the core for the device ABIs, the Kotlin
  # layer's JVM tests against a local server, a debug build, the licence
  # check, and the app's tests on an emulator.
  android:
    needs: android-changes
    if: needs.android-changes.outputs.run == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pwm
          POSTGRES_PASSWORD: pwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      # The core for three ABIs, the server and the emulator's system image
      # don't fit in the runner's free space: remove preinstalled tools this
      # job never uses (.NET, Haskell, Swift, CodeQL, Boost).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # The NDK version the app's build pins (D52 §3).
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
      - run: cargo build --locked -p pwm-server
      - name: Start the sync server
        env:
          PWM_DATABASE_URL: postgres://pwm:pwm@localhost:5432/postgres
        run: |
          export PWM_SERVER_SECRETS="$(target/debug/pwm-server keygen)"
          nohup target/debug/pwm-server > target/pwm-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if target/debug/pwm-server healthcheck; then exit 0; fi
            sleep 1
          done
          cat target/pwm-server.log
          exit 1
      - name: JVM tests, debug build and licence check
        working-directory: apps/android
        env:
          PWM_TEST_SERVER: http://127.0.0.1:8080
        run: ./gradlew --no-configuration-cache :kit:test :app:assembleDebug :app:checkLicense
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app's tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/android
          # The emulator's localhost:8080 is the runner's, where the server
          # runs, so the app's plain-HTTP rule stays as it is (D53 §6).
          script: |
            adb reverse tcp:8080 tcp:8080
            # A large log buffer, so a failure's dump still covers the whole run.
            adb logcat -G 16M
            adb logcat -c
            ./gradlew --no-configuration-cache :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.server=http://localhost:8080 || (adb logcat -d -v time | grep -E "Autofill|autofill_service|FillActivity|CredentialManager|PwmCredential|CredentialActivity|AndroidRuntime|TestRunner" | grep -viE "AiAi|audit|cgroup|ImeTracker|Phenotype|MlBenchmark" | tail -400; exit 1)
      - if: failure()
        run: cat target/pwm-server.log || true

  # Whether the desktop jobs need to run: changes to the app, the shared
  # screens, the core or the design tokens.
  desktop-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(apps/desktop/|ui/|core/|Cargo\.(toml|lock)$|design/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The desktop app on Linux (D66 §9): Ubuntu 22.04 is the oldest supported
  # LTS with WebKitGTK's 4.1 API, the floor. Clippy, the tests against a
  # local server, and the app end to end through tauri-driver under Xvfb.
  desktop-linux:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.run == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pwm
          POSTGRES_PASSWORD: pwm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwm"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: WebKitGTK, the tray library, WebKit's WebDriver and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev webkit2gtk-driver xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/desktop build
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo build --locked -p pwm-server
      - name: Start the sync server
        env:
          PWM_DATABASE_URL: postgres://pwm:pwm@localhost:5432/postgres
        run: |
          export PWM_SERVER_SECRETS="$(target/debug/pwm-server keygen)"
          nohup target/debug/pwm-server > target/pwm-server.log 2>&1 &
          for _ in $(seq 1 60); do
            if target/debug/pwm-server healthcheck; then exit 0; fi
            sleep 1
          done
          cat target/pwm-server.log
          exit 1
      - name: Tests, the server ones included
        env:
          PWM_TEST_SERVER: http://127.0.0.1:8080
        run: cargo test --manifest-path apps/desktop/Cargo.toml --locked
      - name: Linux login through the real pkexec and key holder (D71)
        run: |
          sudo apt-get install -y -qq policykit-1
          cargo build --manifest-path apps/desktop/Cargo.toml --locked -p pwm-keyholder
          sudo install -D -m 0755 apps/desktop/target/debug/pwm-keyholder /usr/libexec/pwm/pwm-keyholder
          sudo install -D -m 0644 apps/desktop/linux/invalid.pwm.unlock.policy /usr/share/polkit-1/actions/invalid.pwm.unlock.policy
          # polkit 0.105 here reads .pkla rules: let the runner through
          # without a dialog, which needs a person.
          sudo mkdir -p /etc/polkit-1/localauthority/50-local.d
          {
            echo "[PWM CI]"
            echo "Identity=unix-user:$USER"
            echo "Action=invalid.pwm.unlock"
            echo "ResultAny=yes"
            echo "ResultInactive=yes"
            echo "ResultActive=yes"
          } | sudo tee /etc/polkit-1/localauthority/50-local.d/pwm-ci.pkla > /dev/null
          sudo systemctl restart polkit || true
          export PWM_TEST_PKEXEC=1
          cargo test --manifest-path apps/desktop/Cargo.toml --locked -p pwm-hello the_real_pkexec
          cargo test --manifest-path apps/desktop/Cargo.toml --locked -p pwm-browser-helper the_real_key_holder
          # Only root can read the secrets.
          sudo stat -c '%U %a %n' /var/lib/pwm/keys "/var/lib/pwm/keys/$(id -u)"
          test "$(sudo stat -c '%U %a' "/var/lib/pwm/keys/$(id -u)")" = "root 700"
          ! ls "/var/lib/pwm/keys/$(id -u)" 2> /dev/null
          # Run by hand, without pkexec, it refuses.
          status=0
          /usr/libexec/pwm/pwm-keyholder create pwm-x || status=$?
          test "$status" -eq 3
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo install tauri-driver --locked --version 2.1.0
      - name: End to end through tauri-driver
        run: |
          # The app's settings point at the local server; there is no
          # Secret Service here, so the keys use the file fallback (D66 §4).
          mkdir -p ~/.local/share/invalid.pwm.desktop
          echo '{"v":1,"serverUrl":"http://127.0.0.1:8080","autoLockMinutes":15}' > ~/.local/share/invalid.pwm.desktop/settings.json
          xvfb-run -a sh -c 'tauri-driver & sleep 2; node apps/desktop/web/e2e/smoke.mjs "$PWD/apps/desktop/target/debug/pwm-desktop"'
      - if: failure()
        run: cat target/pwm-server.log || true

  # The desktop app on Windows (D66 §9): clippy, the tests (DPAPI's key
  # store among them) and a release build. The server and end-to-end tests
  # run on Linux.
  desktop-windows:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/desktop build
      - run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/desktop/Cargo.toml --locked
      - run: cargo build --manifest-path apps/desktop/Cargo.toml --locked --release

  # The Windows installer (D70): built and signed with a throwaway
  # certificate made on each run, the signatures checked, then installed and
  # uninstalled silently for this user. Uninstalling undoes the browser
  # helper's registration (D69 §4), except when another installer replaces
  # this version in place.
  desktop-installer-windows:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          key: installer
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tauri downloads its NSIS toolchain from GitHub Releases while
      # bundling, with no retry, and skips that when %LOCALAPPDATA%\tauri\NSIS
      # already holds it. So fetch it here, with retries and a mirror, and
      # cache it per Tauri CLI version. The URLs and SHA-1s are the ones in
      # the CLI's bundler (crates/tauri-bundler/src/bundle/windows/nsis/mod.rs
      # at the tauri-cli tag); update them when a CLI bump changes them, or
      # Tauri replaces the folder with its own download.
      - name: The Tauri CLI version, for the NSIS cache key
        id: tauri
        shell: bash
        run: echo "cli=$(node -p "require('./apps/desktop/web/package.json').devDependencies['@tauri-apps/cli']")" >> "$GITHUB_OUTPUT"
      - name: Restore the NSIS toolchain
        id: nsis
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: tauri-nsis-${{ steps.tauri.outputs.cli }}
      - name: Fetch the NSIS toolchain where Tauri looks for it
        if: steps.nsis.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = "Stop"
          function Fetch($urls, $sha1, $out) {
            foreach ($url in $urls) {
              curl.exe -fsSL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o $out $url
              if ($LASTEXITCODE -eq 0 -and (Get-FileHash -Algorithm SHA1 $out).Hash -eq $sha1) { return }
              Write-Warning "no good copy from $url"
            }
            throw "could not fetch $out"
          }
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          $nsis = Join-Path $tools "NSIS"
          if (Test-Path $nsis) { Remove-Item -Recurse -Force $nsis }
          New-Item -ItemType Directory -Force $tools | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          Fetch @(
            "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip",
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip"
          ) "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E" $zip
          Expand-Archive $zip -DestinationPath $tools
          Rename-Item (Join-Path $tools "nsis-3.13") "NSIS"
          $additional = Join-Path $nsis "Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $additional | Out-Null
          Fetch @(
            "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
          ) "75197FEE3C6A814FE035788D1C34EAD39349B860" (Join-Path $additional "nsis_tauri_utils.dll")
          if ((Get-FileHash -Algorithm SHA1 (Join-Path $nsis "NSIS.exe")).Hash -ne "6D45D4E8CCF18FE1FDAC9164058F356102A2ECF2") {
            throw "NSIS.exe is not the one Tauri expects"
          }
      - name: Save the NSIS toolchain
        if: steps.nsis.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: tauri-nsis-${{ steps.tauri.outputs.cli }}
      - name: A throwaway code-signing certificate, trusted on this runner only
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=PWM CI throwaway" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\ci.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $sign = @{ cmd = $signtool.FullName; args = @("sign", "/fd", "SHA256", "/sha1", $cert.Thumbprint, "%1") }
          @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\sign.json"
          "PWM_SIGNER=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build and sign the installer
        run: node apps/desktop/web/scripts/installer.mjs --config "$env:RUNNER_TEMP\sign.json"
      - name: Install, check, replace in place, uninstall
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-Signed($path) {
            $sig = Get-AuthenticodeSignature $path
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Thumbprint -ne $env:PWM_SIGNER) {
              throw "$path is not signed by the CI certificate: $($sig.Status)"
            }
          }
          $setup = (Get-ChildItem apps/desktop/target/release/bundle/nsis/*-setup.exe)[0].FullName
          Assert-Signed $setup
          $dir = "$env:LOCALAPPDATA\PWM"

          # Installed for this user, the helper next to the app, all signed.
          Start-Process $setup -ArgumentList "/S" -Wait
          foreach ($name in "pwm-desktop.exe", "pwm-browser-helper.exe", "uninstall.exe") {
            Assert-Signed (Join-Path $dir $name)
          }

          # What the Settings switch writes (D69 §4), another program's key
          # under our name, and an enrolment.
          $hosts = Join-Path $dir "NativeMessagingHosts"
          New-Item -ItemType Directory -Force $hosts, (Join-Path $dir "browser-unlock") | Out-Null
          $chromium = Join-Path $hosts "invalid.pwm.browser.chromium.json"
          $firefox = Join-Path $hosts "invalid.pwm.browser.firefox.json"
          Set-Content $chromium "{}"
          Set-Content $firefox "{}"
          Set-Content (Join-Path $dir "browser-unlock\0123456789abcdef0123456789abcdef.bin") "x"
          $keys = @{
            "HKCU:\Software\Google\Chrome\NativeMessagingHosts\invalid.pwm.browser" = $chromium
            "HKCU:\Software\Mozilla\NativeMessagingHosts\invalid.pwm.browser" = $firefox
            "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\invalid.pwm.browser" = "C:\Other\manifest.json"
          }
          foreach ($key in $keys.Keys) {
            New-Item -Force $key | Out-Null
            Set-ItemProperty $key -Name "(default)" -Value $keys[$key]
          }

          # Another installer replacing this version runs the uninstaller in
          # place: browser unlock stays.
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S", "_?=$dir" -Wait
          if (-not (Test-Path $chromium) -or -not (Test-Path "HKCU:\Software\Google\Chrome\NativeMessagingHosts\invalid.pwm.browser")) {
            throw "replacing the app in place removed browser unlock"
          }
          Start-Process $setup -ArgumentList "/S" -Wait

          # Uninstalling from Windows' Settings runs a copy from the temporary
          # folder, which goes on after this process exits.
          Start-Process (Join-Path $dir "uninstall.exe") -ArgumentList "/S" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "uninstall.exe")); $i++) { Start-Sleep 1 }
          Start-Sleep 2

          foreach ($key in "HKCU:\Software\Google\Chrome\NativeMessagingHosts\invalid.pwm.browser", "HKCU:\Software\Mozilla\NativeMessagingHosts\invalid.pwm.browser") {
            if (Test-Path $key) { throw "$key is still there" }
          }
          $edge = (Get-ItemProperty "HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\invalid.pwm.browser")."(default)"
          if ($edge -ne "C:\Other\manifest.json") { throw "another program's key was touched" }
          if (Test-Path $dir) {
            Get-ChildItem -Recurse $dir | Select-Object -ExpandProperty FullName
            throw "$dir is still there"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-windows
          path: apps/desktop/target/release/bundle/nsis/*-setup.exe
          retention-days: 7

  # The Linux packages (D70): the .deb and .rpm on Ubuntu 22.04 (the
  # WebKitGTK floor), the .rpm and the checksums signed with a throwaway GPG
  # key made on each run, the .deb installed and started, and the Flatpak
  # built from it on the GNOME runtime and started.
  desktop-installer-linux:
    needs: desktop-changes
    if: needs.desktop-changes.outputs.run == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          key: installer
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: WebKitGTK, the tray library, rpm, Flatpak and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm flatpak flatpak-builder xvfb dbus
      - run: pnpm install --frozen-lockfile
      - name: Build the .deb and the .rpm
        run: node apps/desktop/web/scripts/installer.mjs
      - name: Sign the .rpm and the checksums with a throwaway key, then check them
        working-directory: apps/desktop/target/release/bundle
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "PWM CI throwaway <ci@pwm.invalid>" rsa3072 sign 1d
          rpmsign --define "_gpg_name ci@pwm.invalid" --define "_gpg_path $GNUPGHOME" --addsign rpm/*.rpm
          gpg --armor --export ci@pwm.invalid > "$RUNNER_TEMP/ci.asc"
          rpm --dbpath "$RUNNER_TEMP/rpmdb" --initdb
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --import "$RUNNER_TEMP/ci.asc"
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig rpm/*.rpm | tee "$RUNNER_TEMP/checksig.txt"
          grep -q "signatures OK" "$RUNNER_TEMP/checksig.txt"
          sha256sum deb/*.deb rpm/*.rpm > SHA256SUMS
          gpg --batch --armor --detach-sign SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
      - name: Install the .deb and start the app
        run: |
          deb=$(ls apps/desktop/target/release/bundle/deb/*.deb)
          dpkg-deb --field "$deb" Package Depends
          # The browser helper, the key holder and polkit's action (D71 §6).
          dpkg-deb -c "$deb" | tee "$RUNNER_TEMP/deb.txt"
          for file in usr/bin/pwm-browser-helper usr/libexec/pwm/pwm-keyholder usr/share/polkit-1/actions/invalid.pwm.unlock.policy; do
            grep -q " $file$" "$RUNNER_TEMP/deb.txt"
          done
          rpm -qlp apps/desktop/target/release/bundle/rpm/*.rpm | grep -qx /usr/libexec/pwm/pwm-keyholder
          sudo apt-get install -y -qq "./$deb"
          # Still running after 15 seconds: it started.
          status=0
          timeout 15 xvfb-run -a dbus-run-session -- /usr/bin/pwm-desktop || status=$?
          test "$status" -eq 124
          # Purging deletes the key holder's secrets.
          sudo mkdir -p /var/lib/pwm/keys/1000
          sudo apt-get purge -y -qq pwm
          test ! -e /var/lib/pwm
      - name: Build the Flatpak from the .deb and start it
        run: |
          cp apps/desktop/target/release/bundle/deb/*.deb apps/desktop/flatpak/pwm.deb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/flatpak" apps/desktop/flatpak/invalid.pwm.desktop.yml
          flatpak build-bundle "$RUNNER_TEMP/repo" apps/desktop/target/release/bundle/pwm.flatpak invalid.pwm.desktop
          flatpak install --user -y --noninteractive apps/desktop/target/release/bundle/pwm.flatpak
          status=0
          timeout 20 xvfb-run -a dbus-run-session -- flatpak run invalid.pwm.desktop || status=$?
          test "$status" -eq 124
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-installer-linux
          path: |
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm
            apps/desktop/target/release/bundle/SHA256SUMS*
            apps/desktop/target/release/bundle/pwm.flatpak
          if-no-files-found: ignore
          retention-days: 7

  image:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker compose build
      - name: The image holds no shell
        run: "! docker run --rm --entrypoint /bin/sh pwm-server:dev -c true"
      - run: echo "PWM_SERVER_SECRETS=$(docker run --rm pwm-server:dev keygen)" > .env
      - run: docker compose up -d --wait
      - run: cargo run --locked -p pwm-server --example smoke -- http://127.0.0.1:8080
      - run: docker compose exec -T server /pwm-server mark-restored
      - run: cargo run --locked -p pwm-server --example smoke -- http://127.0.0.1:8080
      # Backups (D76 §3): what was written after the backup is gone after the
      # restore, the epoch is new, and the server still works.
      - name: Back up and restore
        run: |
          sql() { docker compose exec -T postgres psql -U pwm -d pwm -tAc "$1"; }
          sh scripts/backup.sh backup.dump
          epoch=$(sql "select epoch from server_meta")
          accounts=$(sql "select count(*) from accounts")
          cargo run --locked -p pwm-server --example smoke -- http://127.0.0.1:8080
          test "$(sql "select count(*) from accounts")" -gt "$accounts"
          # Refused: an existing file, and a file that isn't a backup.
          if sh scripts/backup.sh backup.dump; then exit 1; fi
          if sh scripts/restore.sh compose.yaml; then exit 1; fi
          sh scripts/restore.sh backup.dump
          test "$(sql "select count(*) from accounts")" -eq "$accounts"
          test "$(sql "select epoch from server_meta")" != "$epoch"
          cargo run --locked -p pwm-server --example smoke -- http://127.0.0.1:8080
      - if: failure()
        run: docker compose logs

  # Filling in a real browser (D35): the extension's test build in
  # Chromium against fixture pages, with the sync server from compose.
  autofill-harness:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Must match the wasm-bindgen version in Cargo.lock.
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --locked --release -p pwm-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir extension/core target/wasm32-unknown-unknown/release/pwm_wasm.wasm
      # The new device in the approval test (D46) runs the core in Node.
      - run: wasm-bindgen --target nodejs --out-dir target/wasm/node target/wasm32-unknown-unknown/release/pwm_wasm.wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/extension build:test
      - run: docker compose build
      - run: echo "PWM_SERVER_SECRETS=$(docker run --rm pwm-server:dev keygen)" > .env
      - run: docker compose up -d --wait
      - run: pnpm --filter @pwm/autofill-harness exec playwright install --with-deps chromium
      - run: pnpm --filter @pwm/autofill-harness harness
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autofill-harness-report
          path: tests/autofill-harness/playwright-report/
          retention-days: 14
      - if: failure()
        run: docker compose logs

  # The top-sites runner (D39): nightly against real login pages. It fills a
  # throwaway login and never submits; the report is the artifact, and the
  # release workflow (M10) gates on it with runner/compare.ts.
  autofill-top-sites:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cargo build --locked --release -p pwm-wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir extension/core target/wasm32-unknown-unknown/release/pwm_wasm.wasm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pwm/extension build:test
      - run: docker compose build
      - run: echo "PWM_SERVER_SECRETS=$(docker run --rm pwm-server:dev keygen)" > .env
      - run: docker compose up -d --wait
      - run: pnpm --filter @pwm/autofill-harness exec playwright install --with-deps chromium
      - run: pnpm --filter @pwm/autofill-harness top-sites
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofill-report
          path: tests/autofill-harness/autofill-report.json
          retention-days: 90

  # The public autofill dashboard (D77): last night's report and the live
  # history.json become a static page on GitHub Pages. If the history can't
  # be downloaded, or more than 20% of the sites couldn't load (the runner
  # broke), nothing is published and the last good page stays up.
  autofill-dashboard:
    needs: autofill-top-sites
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: autofill-report
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download the live history
        if: ${{ !inputs.first_dashboard }}
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: curl -fsSL --retry 3 "$BASE_URL/history.json" -o history.json
      - name: Build the page
        env:
          HISTORY: ${{ inputs.first_dashboard && '--first' || '--history history.json' }}
        # HISTORY is two words on purpose.
        run: node tests/autofill-harness/dashboard/build.ts --report autofill-report.json $HISTORY --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  extension-test:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  audit:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
      - run: cargo deny --manifest-path apps/desktop/Cargo.toml check
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license-check
      - run: pnpm audit --audit-level high

  # Nightly: every target for 10 minutes, one job each (D78 §1).
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - envelope_decode
          - vault_share_decode
          - keyset_plaintext
          - secret_key_parse
          - password_normalize
          - totp_parse
          - export_read
          - import_files
          - import_bitwarden_encrypted
          - opaque_messages
          - autofill_rules
          - url_match
          - kit_qr_parse
          - passkey_request
          - asset_links
          - approval_messages
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/pwm-crypto/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }} for 10 minutes
        working-directory: core/pwm-crypto/fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to the musl
        # target, which the address sanitizer does not support.
        run: >
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: core/pwm-crypto/fuzz/artifacts/

  # Pull requests and pushes fuzz only when the core changed, every target
  # for 60 s in one job, so the fuzz crate is built once (D78 §1).
  core-changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(core/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz-quick:
    needs: core-changes
    if: needs.core-changes.outputs.run == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/pwm-crypto/fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Every target is in the nightly matrix
        working-directory: core/pwm-crypto/fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            grep -qxF "          - $t" ../../../.github/workflows/ci.yml || { echo "::error::$t is missing from the nightly fuzz matrix"; exit 1; }
          done
      - name: Fuzz every target for 60 s
        working-directory: core/pwm-crypto/fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to the musl
        # target, which the address sanitizer does not support.
        run: |
          failed=""
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Crashes in:$failed"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: core/pwm-crypto/fuzz/artifacts/
