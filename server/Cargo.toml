[package]
name = "pwm-server"
description = "Sync API server (hosted and self-hosted)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.23.1"
pwm-crypto = { version = "0.0.0", path = "../core/pwm-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "tls-rustls-ring-native-roots"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "json"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# The sync client, end to end against this server (D28).
pwm-store = { path = "../core/pwm-store" }
pwm-sync = { path = "../core/pwm-sync" }
pwm-vault = { path = "../core/pwm-vault" }
