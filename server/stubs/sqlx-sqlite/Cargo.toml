# A stand-in for sqlx-sqlite (D79). sqlx 0.9 lists it as an optional dependency
# that caps libsqlite3-sys below 0.38, and Cargo allows one crate linking
# `sqlite3` per dependency graph even when that dependency is never built. We
# never build sqlx with SQLite, so this stub only declares the features sqlx
# refers to, and lets pwm-store use a patched SQLite. Remove it, and the
# [patch] in the root Cargo.toml, once sqlx accepts libsqlite3-sys 0.39 or later.
[package]
name = "sqlx-sqlite"
version = "0.9.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[features]
_unstable-docs = []
any = []
bundled = []
chrono = []
deserialize = []
json = []
load-extension = []
migrate = []
offline = []
preupdate-hook = []
regexp = []
sqlx-toml = []
time = []
unbundled = []
unlock-notify = []
uuid = []
