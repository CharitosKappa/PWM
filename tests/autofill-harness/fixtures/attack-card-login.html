<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in (then a hidden card)</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form action="attack-card-done.html" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" />
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
      />
      <button id="submit">Sign in</button>
    </form>
  </body>
</html>
