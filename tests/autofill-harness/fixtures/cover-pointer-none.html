<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Covered, clicks passing through</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Covered, clicks passing through</h1>
    <form action="#" onsubmit="return false;">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" />
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
      />
      <button>Sign in</button>
    </form>
    <!-- Clickjacking: a cover that lets clicks through, so hit testing sees the field. -->
    <div
      style="
        position: fixed;
        inset: 0;
        background: white;
        z-index: 10;
        pointer-events: none;
      "
    ></div>
  </body>
</html>
