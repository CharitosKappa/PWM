<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clipped away</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Clipped away</h1>
    <div style="clip-path: inset(0 0 100% 0)">
      <form action="#" onsubmit="return false;">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" />
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
        />
        <button>Sign in</button>
      </form>
    </div>
  </body>
</html>
