<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Change password</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Change password</h1>
    <form action="save-done.html" method="post">
      <label for="current">Current password</label>
      <input
        id="current"
        type="password"
        name="current"
        autocomplete="current-password"
      />
      <label for="new">New password</label>
      <input id="new" type="password" name="new" autocomplete="new-password" />
      <label for="confirm">Confirm new password</label>
      <input
        id="confirm"
        type="password"
        name="confirm"
        autocomplete="new-password"
      />
      <button id="submit">Change</button>
    </form>
  </body>
</html>
