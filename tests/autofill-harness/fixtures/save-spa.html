<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in (single page)</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <div id="login">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" />
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
      />
      <button id="submit" type="button">Sign in</button>
    </div>
    <script>
      // A single-page app: no form submit, the view changes in place.
      document.getElementById("submit").addEventListener("click", () => {
        setTimeout(() => {
          document.getElementById("login").replaceWith(
            Object.assign(document.createElement("p"), {
              textContent: "Welcome",
            }),
          );
        }, 200);
      });
    </script>
  </body>
</html>
