<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A password shown after the username</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
      .later {
        opacity: 0;
        transition: opacity 0.2s;
      }
    </style>
  </head>
  <body>
    <h1>A password shown after the username</h1>
    <!-- Both fields are in the form, but the password row stays transparent
         until the username is sent (D65 §2). The username is filled alone;
         the password waits for the next step. -->
    <form action="#" onsubmit="return false;">
      <label for="email">Email or phone</label>
      <input id="email" type="text" name="account" autocomplete="username" />
      <div class="later">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
        />
      </div>
      <button>Continue</button>
    </form>
  </body>
</html>
