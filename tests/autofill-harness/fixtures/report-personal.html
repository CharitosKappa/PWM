<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A form with personal labels</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Welcome back, Ada</h1>
    <form action="#" onsubmit="return false;">
      <label for="email">Hello Ada (ada@example.com), sign in</label>
      <input id="email" type="email" name="email" autocomplete="username" />
      <label for="password">Password for account 4242424242</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
      />
      <button>Sign in</button>
    </form>
  </body>
</html>
