<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A show-password button inside the field</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      .field {
        position: relative;
        width: 280px;
        margin: 8px 0;
      }
      input {
        display: block;
        box-sizing: border-box;
        width: 280px;
        height: 36px;
        padding-right: 40px;
        border-radius: 8px;
      }
      /* A real button over the field's right end, as Twitch draws one. It
         takes clicks, so hit testing finds it at the bottom-right sample
         point; it lies wholly inside the field and covers less than a
         quarter of it (D65 §3). */
      .show {
        position: absolute;
        right: 1px;
        top: 1px;
        width: 30px;
        height: 34px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: #e8e6f8;
      }
    </style>
  </head>
  <body>
    <h1>A show-password button inside the field</h1>
    <form action="#" onsubmit="return false;">
      <label for="email">Email</label>
      <div class="field">
        <input id="email" type="email" name="email" autocomplete="username" />
      </div>
      <label for="password">Password</label>
      <div class="field">
        <input
          id="password"
          type="password"
          name="password"
          autocomplete="current-password"
        />
        <button type="button" class="show" aria-label="Show password"></button>
      </div>
      <button>Sign in</button>
    </form>
  </body>
</html>
