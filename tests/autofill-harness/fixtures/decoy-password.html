<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A decoy password field</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
      .decoy {
        position: relative;
        height: 0;
      }
      .decoy span {
        position: absolute;
        inset: 0 auto auto 0;
        width: 290px;
        height: 40px;
        background: white;
      }
    </style>
  </head>
  <body>
    <h1>A decoy password field</h1>
    <!-- As on Booking and Notion (D65 §1): the email comes first, and a
         password field people can't reach is there for browsers' own
         password managers. Only the email is filled. -->
    <form action="#" onsubmit="return false;">
      <div class="decoy" aria-hidden="true">
        <input
          id="decoy"
          type="password"
          name="password"
          autocomplete="current-password"
          tabindex="-1"
        />
        <span></span>
      </div>
      <div inert>
        <input
          id="inert-decoy"
          type="password"
          name="password2"
          autocomplete="current-password"
          style="opacity: 0.5"
        />
      </div>
      <label for="email">Email address</label>
      <input id="email" type="email" name="username" autocomplete="username" />
      <button>Continue</button>
    </form>
  </body>
</html>
