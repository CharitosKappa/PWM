<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Never submit</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <form action="trap.html" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" autocomplete="username" />
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        autocomplete="current-password"
      />
      <button>Sign in</button>
    </form>
    <script>
      // A change listener that submits, as a few sites do; the runner must
      // never trigger it beyond the fill itself.
      document.getElementById("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") e.target.form.submit();
      });
    </script>
  </body>
</html>
