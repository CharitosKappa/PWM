<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open shadow DOM</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Open shadow DOM</h1>
    <login-box></login-box>
    <script>
      // The whole form lives in a open shadow root.
      customElements.define(
        "login-box",
        class extends HTMLElement {
          constructor() {
            super();
            const root = this.attachShadow({ mode: "open" });
            root.innerHTML = `<style>input { display: block; width: 280px; height: 32px; margin: 8px 0; }</style>
            <form action="#" onsubmit="return false">
              <label for="email">Email</label>
              <input id="email" type="email" name="email" autocomplete="username" />
              <label for="password">Password</label>
              <input id="password" type="password" name="password" autocomplete="current-password" />
              <button>Sign in</button>
            </form>`;
          }
        },
      );
    </script>
  </body>
</html>
