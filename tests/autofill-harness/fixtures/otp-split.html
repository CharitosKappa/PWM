<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Split one-time code</title>
    <style>
      body {
        font: 16px system-ui;
        margin: 40px;
      }
      input {
        display: block;
        width: 280px;
        height: 32px;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h1>Enter the code</h1>
    <form action="#" onsubmit="return false;" style="display: flex; gap: 8px">
      <input
        id="d1"
        name="d1"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 1"
        autocomplete="one-time-code"
        style="width: 40px"
      />
      <input
        id="d2"
        name="d2"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 2"
        style="width: 40px"
      />
      <input
        id="d3"
        name="d3"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 3"
        style="width: 40px"
      />
      <input
        id="d4"
        name="d4"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 4"
        style="width: 40px"
      />
      <input
        id="d5"
        name="d5"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 5"
        style="width: 40px"
      />
      <input
        id="d6"
        name="d6"
        inputmode="numeric"
        maxlength="1"
        aria-label="Digit 6"
        style="width: 40px"
      />
    </form>
  </body>
</html>
