# One Cargo workspace for all Rust code: the core crates in `core/` and the
# sync server in `server/`. A single lockfile keeps the core version identical
# across server, FFI and WASM builds, and lets `cargo deny` see every dependency.
[workspace]
resolver = "3"
members = [
    "core/pwm-crypto",
    "core/pwm-vault",
    "core/pwm-store",
    "core/pwm-sync",
    "core/pwm-autofill",
    "core/pwm-import",
    "core/pwm-generator",
    "core/pwm-health",
    "core/pwm-export",
    "core/pwm-ffi",
    "core/pwm-wasm",
    "server",
]

exclude = ["core/pwm-crypto/fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

# Argon2 and curve25519 are very slow unoptimized; keep test runs fast.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

# zxcvbn scores with heavy regex use; keep strength tests fast.
[profile.dev.package.zxcvbn]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3
