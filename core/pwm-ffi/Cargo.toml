[package]
name = "pwm-ffi"
description = "UniFFI bindings (Swift, Kotlin) over pwm-client (D31)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
