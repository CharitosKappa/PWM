[package]
name = "pwm-passkey"
description = "Passkeys (D37): WebAuthn requests, ES256 keys, client data, authenticator data, attestation and assertions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
pwm-autofill = { path = "../pwm-autofill" }
pwm-crypto = { path = "../pwm-crypto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.1"

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
