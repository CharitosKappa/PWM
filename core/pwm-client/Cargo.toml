[package]
name = "pwm-client"
description = "The one API the apps and the extension use: account, vault, sync, generator (D31)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
pwm-autofill = { path = "../pwm-autofill" }
pwm-crypto = { path = "../pwm-crypto" }
pwm-export = { path = "../pwm-export" }
pwm-generator = { path = "../pwm-generator" }
pwm-health = { path = "../pwm-health" }
pwm-import = { path = "../pwm-import" }
pwm-kit = { path = "../pwm-kit" }
pwm-passkey = { path = "../pwm-passkey" }
# The client needs only the `Store` trait and `MemoryStore`; native wrappers
# turn on SQLite.
pwm-store = { path = "../pwm-store", default-features = false }
pwm-sync = { path = "../pwm-sync" }
pwm-vault = { path = "../pwm-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
pwm-store = { path = "../pwm-store", default-features = false }
