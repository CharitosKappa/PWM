# Fuzz targets for pwm-crypto decoders (M1.7), pwm-vault parsers, export readers, the autofill engine (D33) and the Emergency Kit code (D42). Run with `just fuzz <target>`
# (Linux/macOS, nightly) or in Docker on Windows, see docs/DEVELOPMENT.md.
#
# Separate workspace on purpose: libFuzzer (Apache-2.0 WITH LLVM-exception)
# is only linked into these test binaries and never ships, so it stays out
# of the product dependency graph checked by `cargo deny`.
[package]
name = "pwm-crypto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pwm-autofill = { path = "../../pwm-autofill" }
pwm-passkey = { path = "../../pwm-passkey" }
pwm-crypto = { path = ".." }
pwm-export = { path = "../../pwm-export" }
pwm-kit = { path = "../../pwm-kit" }
pwm-vault = { path = "../../pwm-vault" }
url = "2.5.8"

[profile.release]
debug = 1

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_share_decode"
path = "fuzz_targets/vault_share_decode.rs"
