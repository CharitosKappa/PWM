# Fuzz targets for pwm-crypto decoders (M1.7), pwm-vault parsers and export readers. Run with `just fuzz <target>`
# (Linux/macOS, nightly) or in Docker on Windows, see docs/DEVELOPMENT.md.
#
# Separate workspace on purpose: libFuzzer (Apache-2.0 WITH LLVM-exception)
# is only linked into these test binaries and never ships, so it stays out
# of the product dependency graph checked by `cargo deny`.
[package]
name = "pwm-crypto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
pwm-crypto = { path = ".." }
pwm-export = { path = "../../pwm-export" }
pwm-vault = { path = "../../pwm-vault" }

[profile.release]
debug = 1

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_share_decode"
path = "fuzz_targets/vault_share_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keyset_plaintext"
path = "fuzz_targets/keyset_plaintext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secret_key_parse"
path = "fuzz_targets/secret_key_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "password_normalize"
path = "fuzz_targets/password_normalize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "totp_parse"
path = "fuzz_targets/totp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "export_read"
path = "fuzz_targets/export_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opaque_messages"
path = "fuzz_targets/opaque_messages.rs"
test = false
doc = false
bench = false
