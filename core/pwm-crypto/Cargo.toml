[package]
name = "pwm-crypto"
description = "Crypto primitives wrappers, KDF, key hierarchy and Secret<T>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
serde_json = "1.0.154"
