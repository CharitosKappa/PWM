[package]
name = "pwm-crypto"
description = "Crypto primitives wrappers, KDF, key hierarchy and Secret<T>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
# opaque-ke 4.0 is generic over the RustCrypto digest 0.10 traits; this older
# sha2 is used only to name its SHA-512 in the OPAQUE cipher suite.
sha2_010 = { package = "sha2", version = "0.10", default-features = false }
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.1"

[dev-dependencies]
hex = "0.4.3"
proptest = "1.11.0"
rand_chacha = "0.3"
serde_json = "1.0.154"
