[package]
name = "pwm-import"
description = "Importers for other password managers' exports, and our own (decision D51)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Bitwarden's password-protected export only (D51 §6): AES-256-CBC with
# HMAC-SHA256, keys from PBKDF2-SHA256 or Argon2id. Never used for our own
# formats.
aes = "0.9.2"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
cbc = "0.2.1"
csv-core = "0.1.13"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hkdf = "0.13.0"
hmac = "0.13.0"
# KeePass KDBX 3.1 and 4 (D51 §5), behind our own header check.
keepass = { version = "0.17.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
pwm-crypto = { path = "../pwm-crypto" }
pwm-export = { path = "../pwm-export" }
pwm-vault = { path = "../pwm-vault" }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
url = "2.5.8"
zeroize = "1.9.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# KDBX 4 fixtures made in the tests.
keepass = { version = "0.17.0", default-features = false, features = ["save_kdbx4"] }
