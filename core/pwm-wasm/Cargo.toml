[package]
name = "pwm-wasm"
description = "wasm-bindgen build of pwm-client for the browser extension (D31)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
js-sys = "0.3.107"
pwm-client = { path = "../pwm-client" }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

# Randomness in the browser: crypto.getRandomValues for every getrandom
# version in the tree (0.4 for our code, 0.3 and 0.2 through dependencies,
# 0.2 for OPAQUE's rand_core; the M3.2 deferral).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
