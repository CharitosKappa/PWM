[package]
name = "pwm-store"
description = "Local encrypted cache: ciphertext-only storage with versioned schema migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]
# SQLite backend for native platforms. WASM builds turn it off and use a
# browser backend behind the same `Store` trait.
sqlite = ["dep:rusqlite"]

[dependencies]
pwm-crypto = { path = "../pwm-crypto" }
pwm-vault = { path = "../pwm-vault" }
# Held at 0.39: its libsqlite3-sys (0.37) is the newest that sqlx 0.9 (server)
# accepts, and Cargo allows only one crate linking `sqlite3` per workspace,
# even an optional one. Upgrade together with sqlx.
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
thiserror = "2.0.21"
