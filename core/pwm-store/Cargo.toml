[package]
name = "pwm-store"
description = "Local encrypted cache: ciphertext-only storage with versioned schema migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["sqlite"]
# SQLite backend for native platforms. WASM builds turn it off and use a
# browser backend behind the same `Store` trait.
sqlite = ["dep:rusqlite"]

[dependencies]
pwm-crypto = { path = "../pwm-crypto" }
pwm-vault = { path = "../pwm-vault" }
# 0.42 bundles SQLite 3.54+ (RUSTSEC-2026-0459). sqlx 0.9 (server) would cap
# libsqlite3-sys below 0.38; the root Cargo.toml patches its unused SQLite
# driver with a stub so this can move ahead (D79).
rusqlite = { version = "0.42", features = ["bundled"], optional = true }
thiserror = "2.0.21"
