[package]
name = "pwm-export"
description = "Encrypted (.pwmx) and plaintext (JSON, CSV) exports of our own vaults."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
csv-core = "0.1.13"
pwm-crypto = { path = "../pwm-crypto" }
pwm-generator = { path = "../pwm-generator" }
pwm-vault = { path = "../pwm-vault" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
serde_json = "1.0.154"
