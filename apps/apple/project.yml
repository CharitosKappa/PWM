# The Xcode project, generated by XcodeGen (D42 §2): `just apple` runs
# `xcodegen generate` here. PWM.xcodeproj is gitignored; edit this file.
name: PWM
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  PWMKit:
    path: PWMKit
targets:
  PWM:
    type: application
    platform: iOS
    sources:
      - App
    # The licences of the core's dependencies and data (S6), made by
    # `just notices`, are copied in when they exist; a build without them
    # says so in Settings. Signing runs after this.
    postBuildScripts:
      - name: Third-party notices
        basedOnDependencyAnalysis: false
        script: |
          for name in rust.html data.md data-autofill.md; do
            file="$SRCROOT/../../THIRD_PARTY_NOTICES/$name"
            if [ -f "$file" ]; then
              cp "$file" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
            fi
          done
    settings:
      base:
        # Placeholders until D1 names the product.
        PRODUCT_NAME: PWM
        PRODUCT_BUNDLE_IDENTIFIER: invalid.pwm.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PWM.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # The notices script reads files that may not exist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: PWMKit
        products: [PWMKit, PWMDesign, PWMUI]
      - target: PWMAutoFill
        embed: true
  # The AutoFill credential provider (D47): passwords and passkeys in
  # Safari and other apps, unlocked with Face ID or Touch ID only.
  PWMAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - AutoFill
    settings:
      base:
        PRODUCT_NAME: PWMAutoFill
        PRODUCT_BUNDLE_IDENTIFIER: invalid.pwm.app.autofill
        INFOPLIST_FILE: AutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoFill/PWMAutoFill.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: PWMKit
        products: [PWMKit, PWMDesign, PWMUI]
  PWMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: invalid.pwm.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: PWM
    dependencies:
      - target: PWM
schemes:
  PWM:
    build:
      targets:
        PWM: all
        PWMUITests: [test]
    test:
      targets:
        - PWMUITests
