# Every dependency is on the licence allow-list (D52 §7): Apache-2.0, except
# JUnit 4 (EPL-1.0), which is used in tests only and never shipped.
[versions]
agp = "9.1.0"
kotlin = "2.4.0"
coroutines = "1.9.0"
serialization = "1.7.3"
jna = "5.17.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.15.0"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
# Espresso before 3.7 breaks on Android 16; Compose's test library pulls it in.
espresso = "3.7.0"
# The kit scanner (D53 §3): CameraX shows the camera, ZXing decodes the QR code.
camerax = "1.4.2"
# The lock timeout's whole-app background (D54 §5).
lifecycle = "2.8.7"
# Fingerprint and face unlock (D55 §2).
biometric = "1.1.0"
# The periodic background sync (D57 §2).
work = "2.10.0"
# Push (D60): FCM only, no other Firebase product.
firebase-messaging = "26.0.1"
# Autofill (D58): inline suggestions, and UiAutomator for its device test.
autofill = "1.1.0"
uiautomator = "2.3.0"
# The Credential Manager provider (D61).
credentials = "1.6.0"
# Google Play Billing (D6 §10): its licence is D60's exception, by module name.
billing = "9.1.0"
zxing = "3.5.3"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
autofill = { module = "androidx.autofill:autofill", version.ref = "autofill" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
billing = { module = "com.android.billingclient:billing", version.ref = "billing" }

[plugins]
license-report = { id = "com.github.jk1.dependency-license-report", version = "2.9" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
