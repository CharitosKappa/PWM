# The desktop app's own Cargo workspace (D66 §2): Tauri and its GTK
# dependencies stay out of the root workspace's jobs, and its SQLite is not
# tied to the server's. The core crates come in by path.
[workspace]
resolver = "3"
members = ["src-tauri", "hello", "browser-helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# As in the root workspace: the KDF and zxcvbn are very slow unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.zxcvbn]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3
