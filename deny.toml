# cargo-deny configuration. Run with `just audit`; CI runs it on every PR and nightly.

[graph]
all-features = true

[advisories]
# Unmaintained/unsound/yanked crates fail too; ignore a specific advisory only
# with a comment and an expiry note.
yanked = "deny"
ignore = [
    # crypto-bigint 0.5 (timing leaks; fixed only in 0.7.6) comes in through
    # elliptic-curve 0.13, which opaque-ke 4.0 always pulls in. Not reachable:
    # our OPAQUE suite is ristretto255 (curve25519-dalek arithmetic) and uses only
    # elliptic-curve's hash-based expand_message_xmd; no NIST curve is built.
    # Remove when opaque-ke ships a stable release on elliptic-curve 0.14.
    # Rechecked at M3.7 (2026-11-02): only 4.1.0-pre.2 exists; recheck at M4.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint not reachable from the ristretto255 OPAQUE suite" },
    # basic-toml is unmaintained (not vulnerable). It comes in only through
    # uniffi_bindgen's askama templates, in pwm-ffi-bindgen: a build tool that
    # reads our own uniffi config and is never shipped. The library the apps
    # link (pwm-ffi) does not contain it. Remove when uniffi drops it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only (uniffi-bindgen tool), never shipped, reads only our own config" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Closed-source allow-list (decision S6). Anything not listed, including GPL,
# AGPL, LGPL, SSPL, BSL and unknown licences, is denied.
# MPL-2.0 is allowed for unmodified upstream files only: never patch an MPL crate.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
# The allow-list is policy, not a record of what is in use.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished and proprietary (LicenseRef-Proprietary).
ignore = true
